# kics-scan disable=555ab8f9-2001-455e-a077-f2d0f41e2fb9
---
name: containers
on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "1 1 * * 4"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matrix:
    name: define matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true
      - name: define matrix
        id: matrix
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          source _shared/_all/matrix.sh
          echo "matrix=${PKG_MATRIX}" >> "${GITHUB_OUTPUT}"
  containers:
    name: "${{ matrix.kind }} ${{ matrix.tag }}"
    needs: matrix
    if: needs.matrix.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    timeout-minutes: 22
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      VERSION_SUFFIX: ${{ format('{0}.{1}', github.run_number, github.run_attempt) }}
      PUBLISH_MODE: "${{ github.event_name == 'schedule' && 'schedule' ||
        github.event_name == 'push' && 'release' || github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]' && 'dev' || 'skip' }}"
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
      - name: build and test images
        run: |
          sudo ./podman.sh
          MANUAL_IMAGES_DIRS='${{ matrix.tag }}/' _shared/_all/build.sh
      - name: push images
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ '${{ matrix.kind }}' == 'img' ]]; then
            echo 'logging in to ghcr for container package'
            printf '%s' "${NODE_AUTH_TOKEN}" |
              podman login ghcr.io --username '${{ github.actor }}' --password-stdin
          else
            echo 'skipping ghcr login for npm package'
          fi
          MANUAL_IMAGES_DIRS='${{ matrix.tag }}/' _shared/_all/push.sh
  matrix-tests:
    name: matrix tests
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: run define-matrix tests
        run: _shared/test/jobs/github-matrix.sh
      - name: run checkout_upstream tests
        run: _shared/test/jobs/checkout-upstream.sh
      - name: run coding helper tests
        run: |
          _shared/test/coding/seccomp.sh
          _shared/test/coding/metadata.sh
  MegaLinter:
    name: MegaLinter
    timeout-minutes: 11
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true
      - name: MegaLinter
        uses: oxsecurity/megalinter@v9
        env:
          VALIDATE_ALL_CODEBASE: true
  all-green:
    name: all green
    timeout-minutes: 3
    runs-on: ubuntu-24.04
    needs:
      - containers
      - matrix-tests
      - MegaLinter
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Check dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")'
