# kics-scan disable=555ab8f9-2001-455e-a077-f2d0f41e2fb9
---
name: app-images
on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  define-matrix:
    name: define matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.define-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true
      - name: define matrix
        id: define-matrix
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          source _shared/_all/matrix.sh
          echo "matrix=${APP_MATRIX}" >> "${GITHUB_OUTPUT}"
      - name: create release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: AppImage [v${{ github.ref_name }}] binaries
          body: version [${{ github.ref_name }}] of AppImage binaries
  appimage:
    name: "build ${{ matrix.tag }} AppImage"
    needs: define-matrix
    if: ${{ !contains(needs.define-matrix.outputs.matrix, '__skip__') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}
    timeout-minutes: 22
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
      - name: build ${{ matrix.tag }} AppImage
        run: |
          sudo ./podman.sh
          _tag='${{ matrix.tag }}'
          APPIMAGE_TARGET="${_tag}" MANUAL_IMAGES_DIRS="${_tag}/" _shared/_all/build.sh
          TAG="${_tag}" _shared/_all/appimage.sh
      - name: make draft and upload AppImage
        if: >-
          github.event_name == 'pull_request' || (
            (github.event_name == 'push')
          ) && github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          name: >
            branch [${{
              github.head_ref == '' && github.ref_name || github.head_ref
            }}] of AppImage binaries
          draft: true
          allowUpdates: true
          tag: v999
          artifacts: "appimage-output/*.AppImage"
          body: >
            branch [${{
              github.head_ref == '' && github.ref_name || github.head_ref
            }}] of AppImage binaries from recent commit by GitHub actions
      - name: make release and upload AppImage
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "appimage-output/*.AppImage"
          name: AppImage [v${{ github.ref_name }}] binaries
          body: version [${{ github.ref_name }}] of AppImage binaries
