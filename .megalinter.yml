---
VALIDATE_ALL_CODEBASE: true
DISABLE_LINTERS:
  - ACTION_ZIZMOR # как-нибудь потом
  - REPOSITORY_OSV_SCANNER # no packages
REPORT_OUTPUT_FOLDER: none
PARALLEL_PROCESS_NUMBER: 11
OUTPUT_FORMAT: text
EXCLUDED_DIRECTORIES:
  - ".git"
  - ".vscode"
BASH_SHFMT_ARGUMENTS: "-i 2"
REPOSITORY_CHECKOV_ARGUMENTS: >-
  --skip-check CKV2_GHA_1,CKV_DOCKER_2,CKV_DOCKER_3,CKV_DOCKER_7,CKV2_DOCKER_1
PRINT_ALL_FILES: true
EDITORCONFIG_EDITORCONFIG_CHECKER_CLI_EXECUTABLE:
  - /ec-custom.sh
SPELL_CSPELL_PRE_COMMANDS:
  - command: |
      npm install --prefix /node-deps @cspell/dict-ru_ru @cspell/dict-software-terms
    cwd: root
SPELL_CSPELL_FILTER_REGEX_EXCLUDE: ".+\\.patch|sources/obsidian/files/conf/.*"
EDITORCONFIG_EDITORCONFIG_CHECKER_FILTER_REGEX_EXCLUDE: "\
  sources/obsidian/files/conf/.*"
JAVASCRIPT_STANDARD_FILTER_REGEX_EXCLUDE: "\
  sources/librechat/files/entrypoint\\.js"
CSS_STYLELINT_FILTER_REGEX_EXCLUDE: "\
  sources/obsidian/files/conf/.*"
EDITORCONFIG_EDITORCONFIG_CHECKER_PRE_COMMANDS:
  - command: |
      cat <<EOF > /ec-custom.sh
      #!/usr/bin/env bash
      editorconfig-checker \$@
      rc=\$?
      # check for multiple empty lines at EOF
      for file in \$@; do
        tail_lines=\$(tail -n 2 "\$file" | grep -c '^$')
        if [ "\$tail_lines" -gt 1 ]; then
          echo "File [\$file] has multiple trailing line"
          rc=\$((rc + 1))
        fi
      done
      exit \$rc
      EOF
      chmod -v 755 /ec-custom.sh
    cwd: workspace
    continue_if_failed: True
REPOSITORY_TRIVY_ARGUMENTS:
  - "--no-progress"
  - "--ignorefile=.trivyignore.yaml"
REPOSITORY_DEVSKIM_ARGUMENTS:
  - "-f"
  - "text"
SPELL_LYCHEE_CONFIG_FILE: ".lychee.toml"
REPOSITORY_KINGFISHER_ARGUMENTS: "--exclude .git"
SPELL_PROSELINT_FILTER_REGEX_EXCLUDE: "\\.github\/"
REPOSITORY_BETTERLEAKS_ARGUMENTS:
  - "--config"
  - ".betterleaks.toml"
